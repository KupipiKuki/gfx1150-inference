name: Clean-Clone Build CI

# Phase 7A-8 (G0 condition C-1): the documented build command must work on a
# fresh clone with only the documented prerequisites -- no ambient pybind11_DIR
# and no pre-existing CMake cache.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  clean-clone-build:
    name: Clean-clone documented build (G0 C-1)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the documented build prerequisites
        # pybind11 is a build requirement (see pyproject.toml). It must be
        # installed for the interpreter the build uses: the configure step
        # discovers it there, so no pybind11_DIR is needed.
        # pytest is needed by the configure smoke test below;
        # actions/setup-python does not ship it.
        run: |
          python -m pip install --upgrade pip \
            "numpy>=1.24.0" "setuptools>=64" wheel "pybind11>=2.12" pytest

      - name: Register the AMD ROCm apt repository
        # The steps AMD documents for the stable repository
        # (rocm.docs.amd.com, "Register ROCm repositories").
        run: |
          sudo mkdir --parents --mode=0755 /etc/apt/keyrings
          wget -qO- https://stable.repo.amd.com/rocm/gpg/packages.gpg \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/amdrocm.gpg > /dev/null
          sudo tee /etc/apt/sources.list.d/amdrocm-stable.sources > /dev/null <<'EOF'
          X-Repo-Id: amdrocm-stable
          Types: deb
          URIs: https://stable.repo.amd.com/rocm/core/packages/ubuntu2404/
          Suites: stable
          Components: main
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/amdrocm.gpg
          Enabled: yes
          EOF
          sudo apt-get update

      - name: Install the ROCm development packages
        # The HIP compiler, the HIP headers and the HIP runtime: everything
        # project(... LANGUAGES HIP) needs at configure and link time.
        run: sudo apt-get install -y --no-install-recommends amdrocm-core-dev

      - name: Configure the project (the documented command)
        # The command the README documents. pybind11_DIR is removed from the
        # environment on purpose: the configure must discover pybind11 itself.
        # The checkout is fresh, so there is no build cache either.
        # The output is kept so that the run records what was discovered.
        run: |
          set -o pipefail
          env -u pybind11_DIR cmake -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log

      - name: Record the configure result in the job summary
        # Makes the run self-evidencing: the line below is the proof that
        # pybind11 was discovered from the interpreter, not from an ambient
        # pybind11_DIR.
        if: always()
        run: |
          {
            echo "### Configure (documented command, no ambient pybind11_DIR)"
            echo
            echo '```'
            grep -E "pybind11 CMake package|Configuring done|Could not find" configure.log || echo "(no configure log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the HIP extension
        run: cmake --build build -j

      - name: Run the configure smoke test
        run: python -m pytest tests/test_build_configure.py -v

      - name: Build the sdist
        run: python setup.py sdist --dist-dir dist

      - name: Install the sdist in a clean venv (full install, with the extension)
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/python -m pip install --upgrade pip \
            "setuptools>=64" wheel "pybind11>=2.12" cmake "numpy>=1.24.0"
          /tmp/sdist-venv/bin/python -m pip install --no-build-isolation dist/*.tar.gz
          /tmp/sdist-venv/bin/python -c "import inference, gguf_parser, matmul_module; print('installed OK')"
